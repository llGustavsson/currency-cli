[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "currency-cli"
version = "0.1.0"
description = "A lightweight currency exchange rate CLI built with python!"
readme = "README.md"
requires-python = ">3.14"

dependencies = [
    "typer>=0.27.0",
    "httpx>=0.28.0",
    "rich>=15.0.0"
    ]

[project.optional-dependencies]
test = ["pytest>=9.0.0"]

[project.scripts]
currency = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]